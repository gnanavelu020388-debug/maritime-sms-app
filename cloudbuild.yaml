steps:
  # Build the Docker image
  - name: "gcr.io/cloud-builders/docker"
    secretEnv:
      - VITE_SUPABASE_URL
      - VITE_SUPABASE_ANON_KEY
    entrypoint: "bash"
    args:
      - "-c"
      - |
        docker build \
          --build-arg VITE_SUPABASE_URL=$$VITE_SUPABASE_URL \
          --build-arg VITE_SUPABASE_ANON_KEY=$$VITE_SUPABASE_ANON_KEY \
          -t asia-south1-docker.pkg.dev/$PROJECT_ID/maritime-sms-repo/maritime-sms-app:$COMMIT_SHA .

  # Push the image
  - name: "gcr.io/cloud-builders/docker"
    args:
      - push
      - asia-south1-docker.pkg.dev/$PROJECT_ID/maritime-sms-repo/maritime-sms-app:$COMMIT_SHA

  # Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args:
      - run
      - deploy
      - maritime-sms
      - --image
      - asia-south1-docker.pkg.dev/$PROJECT_ID/maritime-sms-repo/maritime-sms-app:$COMMIT_SHA
      - --region
      - asia-south1
      - --platform
      - managed
      - --allow-unauthenticated

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/VITE_SUPABASE_URL/versions/latest
      env: VITE_SUPABASE_URL
    - versionName: projects/$PROJECT_ID/secrets/VITE_SUPABASE_ANON_KEY/versions/latest
      env: VITE_SUPABASE_ANON_KEY

images:
  - asia-south1-docker.pkg.dev/$PROJECT_ID/maritime-sms-repo/maritime-sms-app:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY